<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Runmote">
  <!-- bg for favicon tile -->
  <rect width="100" height="100" rx="22" fill="#FFF7EB"/>
  <!-- speed lines -->
  <rect x="10" y="38" width="28" height="4" rx="2" fill="#1A1A1C"/>
  <rect x="22" y="31" width="16" height="3" rx="1.5" fill="#1A1A1C"/>
  <rect x="24" y="48" width="14" height="3" rx="1.5" fill="#1A1A1C"/>
  <rect x="28" y="56" width="10" height="3" rx="1.5" fill="#1A1A1C"/>
  <circle cx="18" cy="49.5" r="2" fill="#1A1A1C"/>
  <!-- chat bubble -->
  <path d="M 38 28 C 58 28 72 28 78 34 C 84 40 84 58 78 64 C 72 70 58 70 46 70 L 38 78 L 38 65 C 30 60 26 52 26 40 C 26 30 32 28 38 28 Z" fill="none" stroke="#1A1A1C" stroke-width="5.2" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- antenna -->
  <line x1="58" y1="28" x2="58" y2="18" stroke="#1A1A1C" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="58" cy="13.5" r="5.5" fill="#1A1A1C"/>
